[project]
name = "owui-office-mcp"
version = "0.7.5"
description = "Office document MCP server for OpenWebUI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.0",
    "httpx2>=2.13.1",
    "pydantic>=2.14.0",
    "pydantic-settings>=2.15.0",
    "valkey>=6.1.1",
]

[tool.uv]
allow-insecure-host = []
index = [{ url = "https://pypi.org/simple", default = true }]

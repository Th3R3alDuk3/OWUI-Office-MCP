[project]
name = "owui-office-mcp"
version = "0.8.0"
description = "Office document MCP server for OpenWebUI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.13"
dependencies = [
    "fastmcp>=4.1.4",
    "httpx2>=2.16.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.16.1",
    "pyvips[binary]>=3.2.0",
    "valkey>=6.2.0",
]

[tool.uv]
allow-insecure-host = []
index = [{ url = "https://pypi.org/simple", default = true }]

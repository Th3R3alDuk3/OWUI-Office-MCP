[project]
name = "owui-office-mcp"
version = "0.5.0"
description = "Office document MCP server for OpenWebUI."
readme = "README.md"
license = "MIT"
requires-python = ">=3.14"
dependencies = [
    "fastmcp>=4.0.5",
    "httpx2>=2.13.0",
    "pydantic>=2.13.5",
    "pydantic-settings>=2.15.0",
    "valkey>=6.1.1",
]

[tool.uv]
allow-insecure-host = []
index = [{ url = "https://pypi.org/simple", default = true }]

name: owui-office-mcp

services:

  server:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: owui-office-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    # OFFICECLI_MAX_PROCESSES x (OFFICECLI_MAX_MEMORY + 0.5 GB for Chromium)
    # plus 2 GB for Python and the tmpfs scratch.
    mem_limit: 8g
    depends_on:
      - valkey

  valkey:
    image: valkey/valkey:9.1.2-alpine
    container_name: valkey
    restart: unless-stopped
    # Drafts: bounded, LRU-evicted, nothing on disk.
    command: valkey-server --maxmemory 1gb --maxmemory-policy volatile-lru --save ""

  valkey-admin:
    image: valkey/valkey-admin:1.2.0
    container_name: valkey-admin
    restart: unless-stopped
    # No login, so localhost only.
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DEPLOYMENT_MODE: Web
      VALKEY_HOST: valkey
      VALKEY_PORT: "6379"
    depends_on:
      - valkey

name: owui-office-mcp

services:

  app:
    build:
      context: .
      dockerfile: docker/Dockerfile.app
    container_name: owui-office-mcp
    restart: unless-stopped
    ports:
      - "8000:8000"
    env_file: .env
    read_only: true
    tmpfs:
      - /tmp
    # OfficeCLI processes x (heap + 0.5 GB Chromium) + 2 GB Python and tmpfs.
    mem_limit: 8g
